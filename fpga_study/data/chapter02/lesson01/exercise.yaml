id: ex_ch02_l01
type: practice
problems:
  - id: p1
    type: fill_number
    question: "ANDゲートで A=1、B=0 のとき出力 Y はいくつですか？"
    answer: 0
    hint: "AND は両方が 1 のときだけ 1 を出力します"
    wrong_hint: "B=0 があるので、AND の出力は 0 です"

  - id: p2
    type: fill_number
    question: "ORゲートで A=1、B=1 のとき出力 Y はいくつですか？"
    answer: 1
    hint: "OR はどちらか一方でも 1 なら 1 を出力します"
    wrong_hint: "A=1 なので OR の出力は 1 です（両方 1 でも 1）"

  - id: p3
    type: fill_number
    question: "ANDゲートで 4 通りの入力パターン（(0,0), (0,1), (1,0), (1,1)）のうち、出力が 1 になるパターンは何通りありますか？"
    answer: 1
    hint: "AND は両方が 1 のときだけ出力が 1 になります"
    wrong_hint: "真理値表を見ると (1,1) のときだけ出力が 1 です。1通りです"
