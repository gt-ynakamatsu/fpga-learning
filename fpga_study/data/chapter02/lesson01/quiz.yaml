questions:
  - id: q1
    question: "ANDゲートの入力が A=1、B=0 のとき、出力Yはいくつですか？"
    options:
      - "0"
      - "1"
      - "どちらでもよい"
      - "わからない"
    answer: 0
    explanation: "ANDゲートは両方の入力が1のときだけ出力が1です。A=1、B=0の場合はBが0なので出力Y=0です。"

  - id: q2
    question: "ORゲートの入力が A=0、B=0 のとき、出力Yはいくつですか？"
    options:
      - "0"
      - "1"
      - "2"
      - "不定"
    answer: 0
    explanation: "ORゲートはどちらか一方でも1なら出力が1です。両方0のときだけ出力Y=0になります。"

  - id: q3
    question: "ANDゲートの出力が1になるのは、入力の何通りですか？（2入力ANDの場合）"
    options:
      - "1通り（A=1, B=1のみ）"
      - "2通り"
      - "3通り"
      - "4通り"
    answer: 0
    explanation: "2入力ANDゲートの真理値表は4通りですが、出力が1になるのはA=1かつB=1の1通りだけです。"

  - id: q4
    question: "「スイッチAまたはスイッチBを押したときだけライトが点く」回路を作るには、どのゲートを使いますか？"
    options:
      - "ANDゲート"
      - "ORゲート"
      - "NOTゲート"
      - "ゲートは不要"
    answer: 1
    explanation: "「または（どちらか一方でも）」の条件はORゲートで実現できます。ORゲートは入力のどちらかが1なら出力を1にします。"
