questions:
  - id: q1
    question: "ANDゲートとORゲートを組み合わせた次の回路で、A=1、B=0、C=1 のとき出力Yはいくつになりますか？\n（A AND B）OR C → Y"
    options:
      - "0"
      - "1"
      - "わからない"
      - "エラー"
    answer: 1
    explanation: "まず A AND B = 1 AND 0 = 0。次にその結果 OR C = 0 OR 1 = 1。よってY=1です。"

  - id: q2
    question: "XORゲートを使って「2つの入力が等しいかどうか」を判断したい場合、どうすればよいですか？"
    options:
      - "XORの出力をそのまま使う（同じなら1）"
      - "XORの出力をNOTに通す（同じなら1）"
      - "ANDを使う"
      - "ORを使う"
    answer: 1
    explanation: "XORは入力が異なるとき1を出します。同じとき1にしたければ、XORの後にNOTを通す（XNOR）と、同じとき1、異なるとき0になります。"

  - id: q3
    question: "ANDゲートとXORゲートで入力が A=1、B=1 のとき、それぞれの出力はどうなりますか？"
    options:
      - "AND=1、XOR=1"
      - "AND=1、XOR=0"
      - "AND=0、XOR=1"
      - "AND=0、XOR=0"
    answer: 1
    explanation: "AND は両方が 1 なので出力 1。XOR は入力が同じ（どちらも 1）なので出力 0。AND=1、XOR=0 です。"
