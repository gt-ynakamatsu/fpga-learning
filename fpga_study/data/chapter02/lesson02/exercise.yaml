id: ex_ch02_l02
type: practice
problems:
  - id: p1
    type: fill_number
    question: "NOTゲートで入力が A=1 のとき、出力 Y はいくつですか？"
    answer: 0
    hint: "NOTゲートは入力を反転します（0→1、1→0）"
    wrong_hint: "NOT: 1→0 に反転するので Y=0"

  - id: p2
    type: fill_number
    question: "XORゲートで A=0、B=0 のとき出力 Y はいくつですか？"
    answer: 0
    hint: "XOR は入力が異なるときだけ 1 です。同じ値のときは？"
    wrong_hint: "A=0, B=0 は同じ値なので XOR の出力は 0 です"

  - id: p3
    type: fill_number
    question: "XORゲートで 4 通りの入力パターンのうち、出力が 1 になるパターンは何通りですか？"
    answer: 2
    hint: "XOR は入力が異なるときだけ 1 になります"
    wrong_hint: "(0,1) と (1,0) の 2 通りが出力 1 です"
