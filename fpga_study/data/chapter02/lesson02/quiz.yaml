questions:
  - id: q1
    question: "NOTゲートの入力が 1 のとき、出力はいくつですか？"
    options:
      - "0"
      - "1"
      - "2"
      - "変わらない"
    answer: 0
    explanation: "NOTゲートは入力を反転します。入力1 → 出力0、入力0 → 出力1です。「インバータ（反転器）」とも呼ばれます。"

  - id: q2
    question: "XORゲートの入力が A=1、B=1 のとき、出力Yはいくつですか？"
    options:
      - "0"
      - "1"
      - "2"
      - "1か0どちらか"
    answer: 0
    explanation: "XOR（排他的OR）は入力が「異なるとき」だけ1を出力します。A=1、B=1は同じなので出力Y=0です。"

  - id: q3
    question: "次のうち、XORゲートの出力が1になる入力の組み合わせはどれですか？"
    options:
      - "A=0, B=0"
      - "A=1, B=1"
      - "A=0, B=1"
      - "どれも1にならない"
    answer: 2
    explanation: "XORは入力が異なるとき出力が1です。A=0とB=1は違うので出力Y=1になります。A=1とB=0でも同様です。"

  - id: q4
    question: "NANDゲートはどのように動きますか？"
    options:
      - "ANDゲートと全く同じ"
      - "ANDゲートの出力を反転したもの"
      - "ORゲートの出力を反転したもの"
      - "NOTゲートを2回かけたもの"
    answer: 1
    explanation: "NANDは「NOT AND」の略で、ANDゲートの出力を反転させます。AND の真理値表の出力を全て逆にしたものがNANDです。"
