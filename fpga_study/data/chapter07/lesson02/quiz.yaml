questions:
  - id: q1
    question: "波形でリセット信号（rst）が 1 のとき、カウンタ値（count）はどうなりますか？"
    options:
      - "前の値を保持する"
      - "0 になる"
      - "増加し続ける"
      - "不定になる"
    answer: 1
    explanation: "同期リセット（rst=1）のとき、always_ff 内の if (rst) count <= 0 が実行されてcountは0になります。"

  - id: q2
    question: "4ビットカウンタが 15（1111₂）の状態でクロックが立ち上がりました。次のcountはいくつですか？"
    options:
      - "15のまま"
      - "0（オーバーフロー）"
      - "16"
      - "不定"
    answer: 1
    explanation: "4ビットの最大値は15（1111₂）です。15+1=16ですが4ビットに収まらないため、0（オーバーフロー）に戻ります。"
