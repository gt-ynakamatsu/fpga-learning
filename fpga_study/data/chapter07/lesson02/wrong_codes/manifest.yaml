# wrong_codes/manifest.yaml — Ch07 Lesson02 (counter4)
# expected フィールド:
#   FAIL                  : deltasim で FAIL することが確認済み
#   PASS_KNOWN_LIMITATION : 整数サイクル制約により現在 PASS する既知の制約
#                           deltasim がサブサイクル刺激に対応次第 FAIL に変更する

wrong_codes:
  - file: saturate_at_15.sv
    expected: FAIL
    reason: "15 で飽和して 0 に戻らない。overflow_15_to_0 ケース（at:19 count=0 期待）で FAIL"

  - file: count_0_to_9.sv
    expected: FAIL
    reason: "0〜9 の 10 進カウンタ。overflow_15_to_0 ケース（at:18 count=15 期待）で FAIL"

  - file: no_reset.sv
    expected: FAIL
    reason: "rst チェックなし。counts_up ケース（初期 count=1 期待）で FAIL"

  - file: async_reset.sv
    expected: PASS_KNOWN_LIMITATION
    reason: >
      always_ff @(posedge clk or posedge rst) は非同期リセットだが、
      deltasim の整数サイクル検査では rst の変化がクロックエッジと同時のため
      同期リセットと区別できない。
      deltasim がサブサイクル刺激に対応した時点で FAIL に変更すること。
