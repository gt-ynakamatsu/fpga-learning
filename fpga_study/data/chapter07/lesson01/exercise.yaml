id: ex_ch07_l01
type: practice
problems:
  - id: p1
    type: fill_number
    question: "spec.yaml で 'at: 10' と書いたとき、何クロック目に処理が行われますか？"
    answer: 10
    hint: "at は直接クロックサイクル数を表します"
    wrong_hint: "at: 10 = 10クロック目"

  - id: p2
    type: fill_number
    question: "100MHzクロック（period_ns: 10）で at: 5 のとき、シミュレーション時間は何ナノ秒ですか？"
    answer: 45
    hint: "クロック周期10ns、立ち上がりは 5ns, 15ns, 25ns, 35ns, 45ns... at:5は5回目の立ち上がり"
    wrong_hint: "5回目の立ち上がり = 5×10 - 5 = 45ns（半周期ずれている）"
