questions:
  - id: q1
    question: "シミュレーションを行う主な目的はどれですか？"
    options:
      - "FPGAのビット列を生成するため"
      - "HDLコードの動作をFPGAに書き込む前に確認するため"
      - "回路の消費電力を測定するため"
      - "配置配線を行うため"
    answer: 1
    explanation: "シミュレーションはFPGAへの書き込み（配置配線）前に、HDLコードが仕様通りに動くかをコンピュータ上で確認するための手段です。"

  - id: q2
    question: "deltasim の spec.yaml で「at: 5」とは何を意味しますか？"
    options:
      - "5ナノ秒（5ns）の時刻"
      - "5番目のクロックサイクル"
      - "5ビットの値"
      - "5回テストを繰り返す"
    answer: 1
    explanation: "spec.yaml の at は「クロックサイクル数」を表します。at: 5 は「5クロック目」という意味です。"

  - id: q3
    question: "VCD（Value Change Dump）ファイルとは何ですか？"
    options:
      - "HDLコードのコンパイル結果"
      - "信号の時系列変化を記録したファイル"
      - "FPGA の設定ファイル"
      - "テスト仕様を定義するファイル"
    answer: 1
    explanation: "VCDは各信号がどのタイミングでどの値に変化したかを記録するファイル形式です。波形ビューアでグラフィカルに表示できます。"
