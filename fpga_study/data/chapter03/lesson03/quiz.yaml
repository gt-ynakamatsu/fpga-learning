status: draft
questions:
  - id: q1
    question: "半加算器で A=1、B=1 の場合、SUM と CARRY の正しい値は？"
    options:
      - "SUM=2、CARRY=0"
      - "SUM=1、CARRY=1"
      - "SUM=0、CARRY=1"
      - "SUM=0、CARRY=0"
    answer: 2
    explanation: "1+1=2（2進数で10）です。SUM（1の位）=0、CARRY（桁上がり）=1 となります。"

  - id: q2
    question: "半加算器の CARRY 出力を作るのに必要なゲートはどれですか？"
    options:
      - "XORゲート"
      - "ORゲート"
      - "ANDゲート"
      - "NOTゲート"
    answer: 2
    explanation: "CARRY（桁上がり）は「両方が1のとき1」= AND ゲートで作ります。SUM（和）は XOR ゲートで作ります。"
