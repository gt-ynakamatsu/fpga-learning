id: puzzle_half_adder
title: "半加算器を作ろう（XOR + AND）"
description: "XORゲートでSUM（和）を、ANDゲートでCARRY（桁上がり）を作ってください。AとBの両方を各ゲートに配線しましょう。"
inputs:
  - name: A
  - name: B
outputs:
  - name: SUM
  - name: CARRY
available_gates:
  - type: XOR
    count: 1
  - type: AND
    count: 1
target_truth_table:
  - inputs: {A: 0, B: 0}
    outputs: {SUM: 0, CARRY: 0}
  - inputs: {A: 0, B: 1}
    outputs: {SUM: 1, CARRY: 0}
  - inputs: {A: 1, B: 0}
    outputs: {SUM: 1, CARRY: 0}
  - inputs: {A: 1, B: 1}
    outputs: {SUM: 0, CARRY: 1}
