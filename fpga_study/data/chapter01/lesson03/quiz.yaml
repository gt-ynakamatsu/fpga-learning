status: draft
questions:
  - id: q1
    question: "16進数の `A` は10進数でいくつですか？"
    options:
      - "8"
      - "9"
      - "10"
      - "11"
    answer: 2
    explanation: "16進数では A=10、B=11、C=12、D=13、E=14、F=15 です。10以上の数字をアルファベットで表します。"

  - id: q2
    question: "2進数 `11110000` を16進数に変換するとどれになりますか？"
    options:
      - "0xEE"
      - "0xF0"
      - "0xFF"
      - "0x0F"
    answer: 1
    explanation: "4ビットずつに分けると 1111=F、0000=0 なので 0xF0 です。"

  - id: q3
    question: "次のビットAND演算の結果はどれですか？\n`1010 AND 1100`"
    options:
      - "1110"
      - "1000"
      - "0110"
      - "0010"
    answer: 1
    explanation: "AND は両方が1のビットだけ1になります。各ビットを見ると：1&1=1, 0&1=0, 1&0=0, 0&0=0 → 1000"

  - id: q4
    question: "`0xFF` を2進数で表すと何ビットすべて1になりますか？"
    options:
      - "4ビット"
      - "6ビット"
      - "7ビット"
      - "8ビット"
    answer: 3
    explanation: "0xFF = F F = 1111 1111 で8ビットすべてが1です。0xFF はよく「全ビット1」のマスクとして使われます。"
