questions:
  - id: q1
    question: "16進数の `A` は10進数でいくつですか？"
    options:
      - "8"
      - "9"
      - "10"
      - "11"
    answer: 2
    explanation: "16進数では A=10、B=11、C=12、D=13、E=14、F=15 です。10以上の数字をアルファベットで表します。"

  - id: q2
    question: "2進数 `11110000`₂ を16進数に変換するとどれになりますか？"
    options:
      - "0xEE"
      - "0xF0"
      - "0xFF"
      - "0x0F"
    answer: 1
    explanation: "4ビットずつに分けると 1111=F、0000=0 なので 0xF0 です。"

  - id: q3
    question: "0xFF を2進数で表すとどれになりますか？"
    options:
      - "11110000"
      - "00001111"
      - "11111111"
      - "01010101"
    answer: 2
    explanation: "0xFF は F=1111、F=1111 なので 11111111₂（8ビットすべて1）です。0xFFはよく「全ビット1」のマスクとして使われます。"

  - id: q4
    question: "`0xCA` を10進数に変換するといくつですか？（C=12、A=10）"
    options:
      - "122"
      - "202"
      - "210"
      - "212"
    answer: 1
    explanation: "0xCA = C×16 + A×1 = 12×16 + 10×1 = 192 + 10 = 202₁₀ です。"
