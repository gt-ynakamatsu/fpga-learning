questions:
  - id: q1
    question: "2進数 `1010`₂ を10進数に変換するといくつですか？"
    options:
      - "8"
      - "10"
      - "12"
      - "14"
    answer: 1
    explanation: "1×8 + 0×4 + 1×2 + 0×1 = 8+0+2+0 = 10₁₀ です。4桁の2進数は8・4・2・1の重さがあります。"

  - id: q2
    question: "10進数の `7`₁₀ を2進数で表すとどれになりますか？"
    options:
      - "0110"
      - "0111"
      - "1000"
      - "1010"
    answer: 1
    explanation: "7 = 4+2+1 = 2²+2¹+2⁰ なので `0111`₂ です。7÷2=3余1、3÷2=1余1、1÷2=0余1 → 下から読んで111、4ビットで表すと0111。"

  - id: q3
    question: "2進数で「くり上がり」が起きるのはどのタイミングですか？"
    options:
      - "9 の次"
      - "1 の次"
      - "7 の次"
      - "15 の次"
    answer: 1
    explanation: "2進数は0と1しか使えないので、1の次でくり上がります。1→10（2進数）は10進数での1→2と同じです。"

  - id: q4
    question: "2進数 `1100`₂ を10進数に変換するといくつですか？"
    options:
      - "10"
      - "11"
      - "12"
      - "13"
    answer: 2
    explanation: "1×8 + 1×4 + 0×2 + 0×1 = 8+4+0+0 = 12₁₀ です。"
