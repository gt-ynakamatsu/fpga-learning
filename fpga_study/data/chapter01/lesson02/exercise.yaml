id: ex_ch01_l02
type: practice
problems:
  - id: p1
    type: fill_number
    question: "10進数の 5₁₀ を2進数にすると何ですか？（10進数で答えてください: 例:「101」→101として数字で）\n※ 実際は 2で割り続けて: 5→2余1, 2→1余0, 1→0余1 → 下から読むと 101₂ = 5"
    answer: 101
    hint: "5 = 4+1 なので 4の位=1、2の位=0、1の位=1"
    wrong_hint: "2で割り続けてください: 5÷2=2余1, 2÷2=1余0, 1÷2=0余1"

  - id: p2
    type: fill_number
    question: "2進数 1001₂ を10進数に変換するといくつですか？"
    answer: 9
    hint: "8×1 + 4×0 + 2×0 + 1×1 = ?"
    wrong_hint: "各桁の重さは左から8、4、2、1です"

  - id: p3
    type: fill_number
    question: "10進数の 14₁₀ を2進数で表すといくつですか？（4桁で表現、先頭0埋め、数字のみ入力: 例1110→1110）"
    answer: 1110
    hint: "14 = 8+4+2 なので 8の位=1、4の位=1、2の位=1、1の位=0"
    wrong_hint: "14÷2=7余0, 7÷2=3余1, 3÷2=1余1, 1÷2=0余1 → 下から読むと1110"
