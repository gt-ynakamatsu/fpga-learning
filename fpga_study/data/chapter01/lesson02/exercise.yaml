id: ex_ch01_l02
type: practice
problems:
  - id: p1
    type: fill_text
    question: "10進数の 5₁₀ を2進数で表してください（0埋めなし、₂はつけない）"
    answer: "101"
    hint: "5 = 4+1 なので、8の位=0、4の位=1、2の位=0、1の位=1"
    wrong_hint: "2で割り続けると: 5→2余1, 2→1余0, 1→0余1 → 下から読むと 101"

  - id: p2
    type: fill_number
    question: "2進数 1001₂ を10進数に変換するといくつですか？"
    answer: 9
    hint: "各桁の重さ: 8の位, 4の位, 2の位, 1の位"
    wrong_hint: "1×8 + 0×4 + 0×2 + 1×1 = 8+0+0+1 = 9"

  - id: p3
    type: fill_text
    question: "10進数の 14₁₀ を4ビットの2進数で表してください（0埋めあり、₂はつけない）"
    answer: "1110"
    hint: "14 = 8+4+2 → 8の位=1、4の位=1、2の位=1、1の位=0"
    wrong_hint: "14÷2=7余0, 7÷2=3余1, 3÷2=1余1, 1÷2=0余1 → 下から読んで1110"
