# wrong_codes/manifest.yaml — Ch06 Lesson01 (AND gate)
# expected フィールド:
#   FAIL                     : spec で確実に FAIL する
#   PASS_KNOWN_LIMITATION     : 自動テストでは区別できない（コーディングルール違反 or §15対応待ち）

wrong_codes:
  - file: and_twostage.sv
    expected: FAIL
    reason: "2段 FF パイプライン。同サイクルチェック（at:3 set & check）で a_d2 が更新されず y=0 になる"

  - file: and_reg1.sv
    expected: PASS_KNOWN_LIMITATION
    reason: >
      出力を 1 段 FF に通す（always_ff @(posedge clk) y <= a & b）。
      at:N の同サイクルチェックでは入力が edge 前に確定しているため、
      FF 経由でも正しい AND と同じ値が取れる。
      コーディングルール違反（組み合わせ AND には FF 不要）として扱う。
