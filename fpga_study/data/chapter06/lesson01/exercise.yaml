id: ex_and_gate
title: "ANDゲートを assign で実装しよう"
type: hdl
difficulty: 1
status: draft
description: |
  module and_gate を完成させてください。
  入力 a と b の AND（論理積）を出力 y に assign してください。
spec_file: spec.yaml
answer_file: answer.sv
template: |
  module and_gate(
      input  logic clk,  // シミュレーション用クロック
      input  logic a,    // 入力A
      input  logic b,    // 入力B
      output logic y     // 出力Y = A AND B
  );
      // 【課題】assign 文を使って y = a AND b を実装してください
      // ヒント: SystemVerilog の AND 演算子は & です
      assign y = /* ここを書いてください */ ;

  endmodule
hints:
  - "assign y = 〇〇 ; の〇〇の部分を書いてください"
  - "SystemVerilog でANDは & 演算子を使います"
  - "答え: assign y = a & b;"
