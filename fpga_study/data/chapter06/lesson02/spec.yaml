version: 1
top: mux2to1
clock:
  signal: clk
  period_ns: 10
reset:
  duration_cycles: 2
sim:
  cycles: 20
  seed: 42
cases:
  - name: "sel0_picks_a"
    inputs:
      - at: 3
        set: {sel: 0, a: 1, b: 0}
    expected:
      - at: 5
        check: {y: 1}
  - name: "sel1_picks_b"
    inputs:
      - at: 3
        set: {sel: 1, a: 0, b: 1}
    expected:
      - at: 5
        check: {y: 1}
  - name: "sel0_ignores_b"
    inputs:
      - at: 3
        set: {sel: 0, a: 0, b: 1}
    expected:
      - at: 5
        check: {y: 0}
