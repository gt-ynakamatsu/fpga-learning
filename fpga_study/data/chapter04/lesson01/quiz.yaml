status: draft
questions:
  - id: q1
    question: "Dフリップフロップで、Q の値が更新されるのはいつですか？"
    options:
      - "D の値が変わったとき"
      - "クロックの立ち上がりエッジのとき"
      - "電源を入れたとき"
      - "Q をリセットしたとき"
    answer: 1
    explanation: "D-FF はクロックの立ち上がりエッジ（0→1 の瞬間）で D の値を Q に記録します。D が変わっただけでは Q は変わりません。"

  - id: q2
    question: "クロックの「立ち上がりエッジ」とは何ですか？"
    options:
      - "クロックが 1 のとき"
      - "クロックが 0 から 1 に変わる瞬間"
      - "クロックの周期が変わるとき"
      - "クロックが停止するとき"
    answer: 1
    explanation: "立ち上がりエッジとは、クロック信号が 0 から 1 に変化する瞬間です。この瞬間を「↑」記号で表します。"

  - id: q3
    question: "組み合わせ回路と順序回路の最大の違いは何ですか？"
    options:
      - "組み合わせ回路の方が速い"
      - "順序回路は状態（以前の入力の結果）を記憶できる"
      - "順序回路はゲートが少ない"
      - "組み合わせ回路はクロックが必要"
    answer: 1
    explanation: "順序回路はフリップフロップなどの記憶素子を持ち、過去の状態を保持できます。組み合わせ回路は現在の入力だけで出力が決まり、状態を記憶しません。"
