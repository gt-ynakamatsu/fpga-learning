status: draft
questions:
  - id: q1
    question: "4ビットカウンタが 0 から数え始めて、何クロック後に再び 0 に戻りますか？"
    options:
      - "8クロック後"
      - "16クロック後"
      - "32クロック後"
      - "256クロック後"
    answer: 1
    explanation: "4ビットで表せる値は 0〜15 の 16通り（2の4乗）です。0, 1, 2, ..., 15 と数えて 16クロック後に 0 に戻ります。"

  - id: q2
    question: "FPGAで一般的に推奨されるリセット方式はどれですか？"
    options:
      - "非同期リセット"
      - "同期リセット"
      - "パワーオンリセットのみ"
      - "リセットは使わない"
    answer: 1
    explanation: "同期リセットはクロックエッジに合わせてリセットされるため、タイミング設計が予測しやすく、FPGAで推奨されます。"

  - id: q3
    question: "100MHzのクロックで動作するカウンタを使って「1秒タイマー」を作るには、カウンタが何になったらリセットすればよいですか？"
    options:
      - "100"
      - "1,000"
      - "1,000,000"
      - "100,000,000"
    answer: 3
    explanation: "100MHzは1秒に1億（100,000,000）回クロックが刻みます。カウンタが100,000,000になったら1秒経過です。このときリセットします。"
