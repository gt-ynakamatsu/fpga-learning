questions:
  - id: q1
    question: "4ビットカウンタが 0 から数え始めて、何クロック後に再び 0 に戻りますか？"
    options:
      - "8クロック後"
      - "16クロック後"
      - "32クロック後"
      - "256クロック後"
    answer: 1
    explanation: "4ビットで表せる値は 0〜15 の 16通り（2を4回かけた数）です。0, 1, 2, ..., 15 と数えて 16クロック後に 0 に戻ります。"

  - id: q2
    question: "この教材で標準とするリセット方式はどれですか？"
    options:
      - "非同期リセット（rst_n=0 でリセット）"
      - "同期リセット・正論理（rst=1 でリセット）"
      - "パワーオンリセットのみ"
      - "リセットは使わない"
    answer: 1
    explanation: "この教材では同期リセット・正論理（rst=1 でリセット）を標準として使います。クロックの立ち上がりエッジのタイミングでリセットするため、タイミング設計がしやすい方式です。"

  - id: q3
    question: "100MHzのクロックで「1秒タイマー」を作るとき、カウンタは 0 から何までカウントすればよいですか？"
    options:
      - "99"
      - "999,999"
      - "99,999,999"
      - "1,000,000,000"
    answer: 2
    explanation: "100MHzは1秒に100,000,000（1億）クロック。0から99,999,999まで数えると100,000,000通り（= 1秒分）です。99,999,999に達したら次のクロックでリセットします。"
