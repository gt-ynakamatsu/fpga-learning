status: draft
questions:
  - id: q1
    question: "D=1 のときにクロックが立ち上がりました。Q の値はどうなりますか？"
    options:
      - "Q = 0"
      - "Q = 1"
      - "Q は変わらない"
      - "Q = D の反転（= 0）"
    answer: 1
    explanation: "D-FF はクロックの立ち上がりエッジで D の値を Q に記録します。D=1 なら Q=1 になります。"

  - id: q2
    question: "D-FF の Q=1 のとき、D=0 に変えました（クロックは来ていない）。Q はどうなりますか？"
    options:
      - "すぐに Q=0 になる"
      - "Q=1 のまま（次のクロックまで変わらない）"
      - "Q が不定になる"
      - "エラーが発生する"
    answer: 1
    explanation: "D-FF はクロックのエッジが来るまで Q の値を保持します。D が変わっても次のクロックエッジまで Q は更新されません。これが「記憶」の仕組みです。"
