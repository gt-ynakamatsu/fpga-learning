questions:
  - id: q1
    question: "自動ドアの例で、状態が OPEN (Q=1) で IN=0 のとき、次の状態（D）はいくつですか？"
    options:
      - "D=1（OPEN のまま）"
      - "D=0（CLOSED に遷移）"
      - "D=X（不定）"
      - "エラー"
    answer: 1
    explanation: "状態遷移表より、OPEN（Q=1）で IN=0 のとき次状態 D=0（CLOSED）です。この例では D=IN なので D=0 になります。"

  - id: q2
    question: "3つの状態（青・黄・赤）を持つ信号機の状態レジスタには最低何ビット必要ですか？"
    options:
      - "1ビット（2通り）"
      - "2ビット（4通り）"
      - "3ビット（8通り）"
      - "4ビット（16通り）"
    answer: 1
    explanation: "3状態を表すには少なくとも2ビット（4通り）必要です。1ビットでは2通りしか表せません。3ビットは必要以上です（ワンホット符号化の場合は3ビット使うこともあります）。"

  - id: q3
    question: "ステートマシンの設計で「次状態ロジック」とは何ですか？"
    options:
      - "現在の状態を記憶する回路"
      - "現在の状態と入力から次の状態を計算する組み合わせ回路"
      - "出力の値を計算する回路"
      - "クロックを生成する回路"
    answer: 1
    explanation: "次状態ロジックは、現在の状態（Qレジスタの値）と入力信号から、次のクロックエッジで保持すべき状態（D入力）を計算する組み合わせ回路です。"
