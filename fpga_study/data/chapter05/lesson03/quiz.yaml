status: draft
questions:
  - id: q1
    question: "自動販売機の例で、S1（1枚投入済み）のとき COIN=1 が入力されました。次の状態は何ですか？"
    options:
      - "S0（待機）"
      - "S1（1枚投入済みのまま）"
      - "S2（商品排出）"
      - "エラー状態"
    answer: 2
    explanation: "S1 で COIN=1 が入ると、合計2枚になったので商品を出せます。次の状態は S2（排出）です。"

  - id: q2
    question: "この自動販売機（ムーア型）の VEND 出力が 1 になるのはどの状態ですか？"
    options:
      - "S0 のとき"
      - "S1 のとき"
      - "S2 のとき"
      - "COIN=1 のときすべて"
    answer: 2
    explanation: "ムーア型ではアウトプットは状態のみに依存します。VEND=1 は S2（商品排出状態）のときだけです。"

  - id: q3
    question: "ステートマシンの設計で「カルノー図」を使う目的は何ですか？"
    options:
      - "状態遷移図を自動的に描くため"
      - "次状態ロジックの論理式を簡略化するため"
      - "クロック周波数を決めるため"
      - "状態の数を減らすため"
    answer: 1
    explanation: "カルノー図（Karnaugh Map）は真理値表から論理式を効率的に導き、できるだけシンプルな式に簡略化するためのツールです。次状態ロジックや出力ロジックの設計に使います。"

  - id: q4
    question: "ステートマシンを FPGA で実装するとき、状態を記憶するのに使う素子は何ですか？"
    options:
      - "ANDゲート"
      - "フリップフロップ"
      - "マルチプレクサ"
      - "デコーダ"
    answer: 1
    explanation: "状態はフリップフロップで記憶します。N ビットの状態レジスタには N 個のフリップフロップが必要です。次状態ロジックは組み合わせ回路で実装します。"
