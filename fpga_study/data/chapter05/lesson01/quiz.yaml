questions:
  - id: q1
    question: "ステートマシンの「状態」とは何ですか？"
    options:
      - "回路の電圧の高さ"
      - "回路が現在どのモードにいるかを表す概念"
      - "クロックの周波数"
      - "入力信号の数"
    answer: 1
    explanation: "状態（State）はステートマシンが現在「どのモードにいるか」を表します。信号機でいえば「青」「黄」「赤」がそれぞれの状態です。"

  - id: q2
    question: "ON/OFFを切り替えるボタン回路（ステートマシン）で、現在S0（OFF）のときにbtn=1が入力されました。次の状態はどれですか？"
    options:
      - "S0（OFFのまま）"
      - "S1（ONに切り替わる）"
      - "エラー状態"
      - "不定"
    answer: 1
    explanation: "状態遷移表より、S0（OFF）でbtn=1のとき次状態はS1（ON）です。ボタンを押すたびにON→OFF→ON...と切り替わります。"

  - id: q3
    question: "「ボタンを押すたびにON/OFFが切り替わる」回路に必要な最小の状態数は何個ですか？"
    options:
      - "1個"
      - "2個（ONとOFF）"
      - "4個"
      - "ボタンの押した回数分"
    answer: 1
    explanation: "ON と OFF の2状態だけ必要です。ボタンを押すたびに ON→OFF→ON... と遷移します。有限状態機械は少ない状態で多くの動作を表現できます。"
