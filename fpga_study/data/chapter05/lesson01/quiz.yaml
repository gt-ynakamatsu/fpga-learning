questions:
  - id: q1
    question: "ステートマシンの「状態」とは何ですか？"
    options:
      - "回路の電圧の高さ"
      - "回路が現在どのモードにいるかを表す概念"
      - "クロックの周波数"
      - "入力信号の数"
    answer: 1
    explanation: "状態（State）はステートマシンが現在「どのモードにいるか」を表します。信号機でいえば「青」「黄」「赤」がそれぞれの状態です。"

  - id: q2
    question: "ムーア型ステートマシンとミーリー型ステートマシンの違いはどこですか？"
    options:
      - "ムーア型は状態数が多い"
      - "ミーリー型は出力が現在の状態と入力の両方に依存する"
      - "ムーア型はクロックが不要"
      - "ミーリー型は組み合わせ回路のみで作れる"
    answer: 1
    explanation: "ムーア型は出力が現在の状態のみで決まります。ミーリー型は現在の状態と入力の両方で出力が決まります。ミーリー型の方が少ない状態で複雑な動作が可能です。"

  - id: q3
    question: "「ボタンを押すたびにON/OFFが切り替わる」回路に必要な最小の状態数は何個ですか？"
    options:
      - "1個"
      - "2個（ONとOFF）"
      - "4個"
      - "ボタンの押した回数分"
    answer: 1
    explanation: "ON と OFF の2状態だけ必要です。ボタンを押すたびに ON→OFF→ON... と遷移します。有限状態機械は少ない状態で多くの動作を表現できます。"
