[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-study"
version = "0.1.0"
description = "FPGA初心者向けインタラクティブ学習アプリ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pyyaml>=6.0",
    "markdown>=3.6",
    "jsonschema>=4.22.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
fpga-study = "fpga_study.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fpga_study*"]

[tool.setuptools.package-data]
fpga_study = ["static/*", "data/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["fpga_study"]
omit = ["fpga_study/static/*"]
